{{ partial "header.html" . }}

<main id="main-content" tabindex="-1" class="page-content" aria-label="Content" style="padding-bottom: 5px;">
  <div class="wrapper wrapper_post">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
      </header>
      <div class="post-content">{{ .Content }}</div>
    </article>
  </div>
</main>

{{ partial "footer.html" . }}

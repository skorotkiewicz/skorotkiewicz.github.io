name: Publish blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: "1.105.2"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up SCSS compiler
        run: |
          curl --fail --location --retry 3 "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" --output "${RUNNER_TEMP}/dart-sass.tar.gz"
          tar --extract --gzip --file "${RUNNER_TEMP}/dart-sass.tar.gz" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Report excluded content
        run: |
          echo "Drafts (not published):"
          hugo list drafts
          echo "Future posts (require a build after their publication date):"
          hugo list future

      - name: Build
        run: |
          sass --version
          hugo --minify --panicOnWarning --printPathWarnings

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
